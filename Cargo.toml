[package]
name = "obd2_esp32_p4"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
resolver = "3"

[[bin]]
name = "obd2_esp32_p4"
harness = false # no test harness on the target

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z" # unoptimized std builds are too large/slow on the MCU

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"

[build-dependencies]
embuild = "0.33"
